<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Obsidian Midnight Canvas -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030714" />
      <stop offset="40%" stop-color="#060c22" />
      <stop offset="75%" stop-color="#08112d" />
      <stop offset="100%" stop-color="#02040b" />
    </linearGradient>

    <!-- Glowing Electric Blue Wave Gradient -->
    <linearGradient id="waveElectricBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1b4f" stop-opacity="0.2" />
      <stop offset="35%" stop-color="#1d4ed8" stop-opacity="0.65" />
      <stop offset="65%" stop-color="#2563eb" stop-opacity="0.85" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.9" />
    </linearGradient>

    <!-- Intense Cyan-White Light Flare Radial Burst (Right Side) -->
    <radialGradient id="rightCyanBurst" cx="82%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="15%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#08112d" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030714" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Sapphire Glow (Center/Left) -->
    <radialGradient id="leftAmbientGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030714" stop-opacity="0" />
    </radialGradient>

    <!-- Vertical Fluted Bar Gradients for 3D Ribbed Glass Texture -->
    <linearGradient id="fluteLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="fluteDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#08112d" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Vertical Fluted Stripes Pattern -->
    <pattern id="flutedColumns" width="48" height="1080" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="22" height="1080" fill="url(#fluteLight)" />
      <rect x="22" y="0" width="4" height="1080" fill="rgba(56, 189, 248, 0.15)" />
      <rect x="26" y="0" width="22" height="1080" fill="url(#fluteDark)" />
    </pattern>

    <!-- Wave Mask to Shape Vertical Flutes along the Curved Arc -->
    <linearGradient id="verticalFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- 1. Obsidian Base Canvas -->
  <rect width="1920" height="1080" fill="url(#obsidianBg)" />

  <!-- 2. Ambient Sapphire Light Bloom -->
  <rect width="1920" height="1080" fill="url(#leftAmbientGlow)" />

  <!-- 3. Sweeping Luminous Fluted Wave Arc (Curving upwards to the right) -->
  <path d="M -100,1180 Q 500,850 1000,680 T 1940,100 L 1940,1180 Z" fill="url(#waveElectricBlue)" opacity="0.85" />
  <path d="M -100,1080 Q 600,750 1150,550 T 1940,0 L 1940,1080 Z" fill="url(#waveElectricBlue)" opacity="0.6" />

  <!-- 4. Vertical Fluted Glass Texture Layer -->
  <g opacity="0.65" style="mix-blend-mode: overlay;">
    <rect width="1920" height="1080" fill="url(#flutedColumns)" />
  </g>

  <!-- 5. Secondary Fluted Light Ribs Overlay for Depth -->
  <g opacity="0.4" style="mix-blend-mode: color-dodge;">
    <rect width="1920" height="1080" fill="url(#flutedColumns)" mask="url(#verticalFade)" />
  </g>

  <!-- 6. Right-side Radiant Light Burst (Inspired by reference picture) -->
  <circle cx="1600" cy="420" r="650" fill="url(#rightCyanBurst)" style="mix-blend-mode: screen;" />

  <!-- 7. Ambient Glowing Rib Lines -->
  <path d="M 600,1080 Q 1100,700 1650,200" stroke="rgba(103, 232, 249, 0.4)" stroke-width="3" fill="none" filter="blur(2px)" />
  <path d="M 750,1080 Q 1250,650 1780,100" stroke="rgba(56, 189, 248, 0.6)" stroke-width="4" fill="none" filter="blur(1px)" />

  <!-- 8. Subtle Top Specular Glass Horizon -->
  <line x1="0" y1="1" x2="1920" y2="1" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
</svg>